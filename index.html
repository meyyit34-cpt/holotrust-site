<style>
:root{color-scheme:light dark;--bg:#f5f7fb;--panel:#fff;--line:#d9e0ec;--text:#111a2c;--muted:#52627c;--accent:#0b8f78;--ink:#fff;--violet:#6b5bd6;--glass:rgba(245,247,251,.78);--sh:0 1px 2px rgba(16,24,40,.06),0 14px 36px rgba(16,24,40,.1);--ease:cubic-bezier(.2,.8,.2,1)}

.bar{display:flex;align-items:center;gap:14px;min-height:60px}

button,.btn{font:inherit;font-weight:700;min-height:44px;padding:0 18px;border:0;border-radius:12px;cursor:pointer;color:var(--ink);background:var(--accent);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s var(--ease),filter .15s}
button:active,.btn:active{transform:scale(.98)}.btn:hover,button:hover{filter:brightness(1.08)}

section{padding:84px 0}section h2{font-size:clamp(28px,4.6vw,44px);margin-bottom:14px}.sub{max-width:680px;color:var(--muted);margin:0 0 36px}

.tilt{--rx:0deg;--ry:0deg;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .2s var(--ease)}
.tilt .ic{display:grid;place-items:center;width:46px;height:46px;margin-bottom:14px;border-radius:14px;color:var(--ink);background:linear-gradient(135deg,var(--accent),var(--violet));font-size:22px}

.stack{position:relative;width:260px;height:160px;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-34deg);transition:transform .6s var(--ease)}
.slab{position:absolute;inset:0;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 86%,var(--c));box-shadow:0 20px 40px rgba(0,0,0,.25);transition:transform .5s var(--ease),border-color .3s,box-shadow .3s;display:grid;place-items:center;font-weight:800;letter-spacing:.06em;color:var(--c);font-size:13px;text-transform:uppercase}

.layer{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;text-align:left;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}

.chip{margin-left:auto;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.04em;background:color-mix(in srgb,var(--c2) 22%,transparent);color:var(--text);border:1px solid var(--c2)}

.dom{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:18px;text-align:center}
.ring{--p:0;position:relative;isolation:isolate;display:grid;place-items:center;width:84px;height:84px;margin:0 auto 10px;border-radius:50%;font-weight:800;font-size:20px;background:conic-gradient(var(--c) calc(var(--p)*1%),color-mix(in srgb,var(--muted) 22%,transparent) 0)}
.ring:before{content:"";position:absolute;inset:7px;z-index:-1;border-radius:50%;background:var(--panel)}
.dom small{color:var(--muted)}
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--line);display:grid;gap:22px}
.tl li{position:relative}.tl li:before{content:"";position:absolute;left:-30px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--c2);box-shadow:0 0 0 4px var(--bg)}
.tl strong{display:block;margin-bottom:2px}.tl span.chip{margin:0 0 0 8px;vertical-align:middle}.tl p{margin:0;color:var(--muted);font-size:15px}
.try{display:grid;place-items:center;text-align:center;padding:48px 24px;border:1px solid var(--line);border-radius:28px;background:radial-gradient(600px 240px at 50% 0,color-mix(in srgb,var(--accent) 18%,transparent),transparent),var(--panel);box-shadow:var(--sh)}

.strip{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;color:var(--muted);font-size:13px}.strip span:before{content:"✓ ";color:var(--accent);font-weight:800}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:18px}.card h3{font-size:18px;margin-bottom:6px}.card p{margin:0;color:var(--muted);font-size:15px}

details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 18px;margin-bottom:10px}summary{cursor:pointer;min-height:56px;display:flex;align-items:center;font-weight:700;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:"+";margin-left:auto;padding-left:12px;font-size:22px;color:var(--accent)}details[open] summary:after{content:"–"}details p{margin:0 0 16px;color:var(--muted)}

@supports(backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){.sticky{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}}
footer{padding:36px 0 56px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease),transform .6s var(--ease)}.rv.in{opacity:1;transform:none}
@media(max-width:820px){.sticky{display:block}footer{padding-bottom:100px}.arch{grid-template-columns:1fr}.stage{height:290px}.stack{width:210px;height:130px}.hero:after{background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 84%,transparent) 0,transparent 80%)}section{padding:60px 0}.copy{padding:40px 0 130px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>

const DEMO="https://meyyit34-cpt.github.io/holotrust-site/demo.html",CODE="https://github.com/meyyit34-cpt/HoloTrust";
const D={tr:{"n.vision":"Vizyon","n.faq":"SSS","h.how":"Nasıl çalışır?","h.s1":"Açık kaynak (MIT)","h.s2":"Holochain ile ajan merkezli","h.s3":"Hesap gerekmez","pb.title":"Güven bugün birkaç şirketin elinde","pb.sub":"Platformlar kimin güvenilir olduğuna karar veriyor ve bu kararı taşımana izin vermiyor.","pb1":"Taşınamayan itibar","pb1d":"Bir platformda yıllarca kazandığın puan başka yerde geçmez; platform kuralı değiştirirse ya da kapanırsa kaybolur.","pb2":"Tek puan yanıltır","pb2d":"Tek bir yıldız ortalaması kimin neyde güvenilir olduğunu söylemez ve kolayca şişirilebilir.","pb3":"Ajanlar kimliksiz","pb3d":"Yapay zekâ ajanları çoğalıyor; kim oldukları, neye yetkili oldukları ve geçmişleri çoğu zaman bilinmiyor.","hw.title":"Üç adımda alan alan güven","hw.sub":"Basit tutulan bir model: kimlik, kanıt, açıklama.","hw1":"Kimliğini sahiplen","hw1d":"Kriptografik anahtarınla kendi profilini oluşturursun. Kimse onu senin adına silemez ya da değiştiremez.","hw2":"Alan bazlı değerlendirme al","hw2d":"Ticaret, teknik, ağırlama gibi alanlarda ayrı değerlendirmeler. Aynı kişi aynı alanda bir kez değerlendirir.","hw3":"Nedenini göster","hw3d":"Bir puanın arkasında kaç kişi, ne zaman ve hangi dağılım olduğu açıkça görünür.","u.title":"Kimler için?","u.sub":"Güveni taşınabilir ve açıklanabilir yapmak isteyen herkes için.","u1":"Yapay zekâ ajanı pazaryerleri","u1d":"Ajanın hangi alanda güvenilir olduğunu göster, genel bir etiketle yanıltma.","u2":"Bağımsız çalışanlar ve hizmet platformları","u2d":"Kazandığın güven platformdan bağımsız seninle gelsin.","u3":"Çevrimiçi topluluklar","u3d":"Katkı ve davranış itibarını alan alan, şeffaf biçimde izle.","u4":"Barındırma ve altyapı sağlayıcıları","u4d":"Süreklilik ve kalite için bağlamsal, kanıta dayalı itibar.","pf.title":"Kanıt: söz değil, doğrulanabilir işler","pf.sub":"Henüz müşteri hikâyemiz yok ve bunu saklamıyoruz. Bunun yerine kendin kontrol edebileceğin şeyler var.","pf1":"Açık kaynak","pf1d":"Kod herkese açık ve MIT lisanslı; her değişiklik incelenebilir.","pf2":"Testlerle geliştirilir","pf2d":"Çoklu ajan senaryoları ve arayüz davranışları otomatik testlerle denenir.","pf3":"Güvenlik ağın kuralında","pf3d":"Doğrulama kuralları ağın kendi katmanında tutulur; başkasının kaydını silmeyi ve güncellemeyi engellemek için kurallar yazıldı.","pf4":"Çalışan demo","pf4d":"Hesap açmadan dene. Veriler sahtedir ve sayfa bunu açıkça söyler.","hn.title":"Dürüst durum","hn.body":"HoloTrust erken aşamada ve denetlenmedi. Gerçek ağ bağlantısı yolda; bugün gördüğün arayüz demo verisiyle çalışır.","ep.title":"Erken ortak ol","ep.body":"Bir platform ya da topluluk geliştiriyorsan alan modelini birlikte şekillendirelim.","ep.b1":"İhtiyacın olan alanları söyle, öncelik buna göre belirlensin.","ep.b2":"Entegrasyon fikirlerini erkenden birlikte netleştirelim.","ep.b3":"Proje ücretsiz ve açık kaynaktır.","ep.cta":"GitHub’da başla","ep.note":"Bu henüz resmî bir hizmet ya da sözleşme değildir; açık bir iş birliği çağrısıdır.","ab.title":"Hikâyemiz","ab.body":"HoloTrust, internetin platform merkezliden ajan merkezliye geçtiği düşüncesinden doğdu. Kimliğin ve itibarın kullanıcıya ait olması gerektiğine, güvenin kanıtlanabilir ve bağlama göre hesaplanması gerektiğine inanıyoruz. Bir anahtarın kontrolü gerçek dünya kimliğini kanıtlamaz; bu ayrımı mimarinin temelinde koruyoruz.","q.title":"Sık sorulan sorular","q1":"HoloTrust bir blokzincir mi?","q1a":"Hayır. Holochain ajan merkezlidir: her katılımcı kendi kaydını tutar ve ağ kuralları birlikte doğrular. Küresel tek bir defter yoktur.","q2":"Gerçek kimliğimi kanıtlar mı?","q2a":"Hayır. Anahtar kontrolü yalnızca anahtarın sahibini gösterir. Profil kişinin kendi beyanıdır; başkalarının doğrulanabilir iddiaları ayrı bir katmandır.","q3":"Neden tek bir puan yok?","q3a":"Tek puan bağlamı siler ve manipüle etmesi kolaydır. Her alan kendi puanı, sayısı ve dağılımıyla ayrı gösterilir.","q4":"Sahte hesaplarla puanı şişirmek mümkün mü?","q4a":"Tamamen engellenemez; bu açık bir araştırma konusu. Bu yüzden puanın nedeni (kaç farklı kişi, ne zaman) görünür kılınır ve demoda saldırıyı kendin deneyebilirsin.","q5":"Hazır mı, kullanabilir miyim?","q5a":"Demoyu hemen deneyebilirsin. Gerçek ağ bağlantısı ve denetim henüz yok; üretimde kullanmak için erken.","q6":"Ücretli mi?","q6a":"Proje açık kaynaktır (MIT). Şu an bir ücret ya da jeton yoktur.","n.arch":"Mimari","n.rep":"İtibar","n.road":"Yol haritası","n.try":"Dene","h.eyebrow":"Holochain · Ajan merkezli","h.title":"Merkezi sahiplik olmadan <em>güven.</em>","h.sub":"Platformlar itibarını kilitlemesin. Kimliğin senin, kanıtlar doğrulanabilir, itibar her alanda ayrı hesaplanır. İnsanlar, yapay zekâ ajanları ve servisler için.","h.demo":"Demoyu 1 dakikada dene","h.code":"GitHub’da incele","h.note":"Erken aşama · demo verileri sahtedir · bir ağı sürükleyerek döndür","v.title":"Neden HoloTrust?","v.body":"İnternet platform merkezliden ajan merkezliye geçiyor. Yapay zekâ ajanları bağımsız hareket ettikçe kim oldukları, neye yetkili oldukları ve ne kadar güvenilir oldukları
